name: update-core-lockfiles-0.3.67

on:
  push:
    branches:
      - fix/integration-ticket-objectid-render
    paths:
      - package.json
      - backend/package.json
      - frontend/package.json
      - .github/workflows/update-core-lockfiles-0.3.67.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/integration-ticket-objectid-render
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Atualizar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend

      - name: Publicar lockfiles na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles já estavam atualizados."
            exit 0
          fi
          git commit -m "chore: atualizar lockfiles para OonCore 0.3.67"
          git push origin HEAD:fix/integration-ticket-objectid-render
