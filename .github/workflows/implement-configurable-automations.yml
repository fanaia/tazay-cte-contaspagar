name: implement-configurable-automations

on:
  push:
    branches:
      - agent/automacoes-configuraveis-reset-base
    paths:
      - .github/workflows/implement-configurable-automations.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Fazer checkout sem action externa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Aplicar implementação
        run: python3 .github/scripts/implement-configurable-automations.py
      - name: Instalar dependências
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar Central
        run: |
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "for (const f of ['central.app.json','frontend/central.ui.json','backend/central.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          npm test --prefix backend
          npm run build --prefix frontend
      - name: Commitar implementação validada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/implement-configurable-automations.py .github/workflows/implement-configurable-automations.yml
          git add backend/src backend/test frontend/central.ui.json
          git commit -m "feat: tornar automações configuráveis e adicionar reset da base"
          git push origin HEAD:agent/automacoes-configuraveis-reset-base
