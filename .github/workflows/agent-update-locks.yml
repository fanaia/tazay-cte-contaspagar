name: agent-update-locks

on:
  push:
    branches: [agent/core-0.3.75-rbac]

permissions:
  contents: write

jobs:
  update-locks:
    if: ${{ !contains(github.event.head_commit.message, '[locks]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-0.3.75-rbac
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Sincronizar documentação do Core
        run: |
          npm ci --ignore-scripts
          npm run ooncore:docs
      - name: Publicar lockfiles e cache do Core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json frontend/package-lock.json .ooncore
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
            exit 0
          fi
          git commit -m "chore: regenerate OonCore 0.3.75 locks [locks]"
          git push origin HEAD:agent/core-0.3.75-rbac
