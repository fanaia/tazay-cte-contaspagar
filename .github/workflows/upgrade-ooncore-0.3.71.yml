name: upgrade-ooncore-0.3.71

on:
  push:
    branches:
      - feat/sidecar-omie-automatico
    paths:
      - .github/workflows/upgrade-ooncore-0.3.71.yml

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sidecar-omie-automatico
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Atualizar manifestos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = {
            root: 'package.json',
            backend: 'backend/package.json',
            frontend: 'frontend/package.json',
            app: 'central.app.json',
          };
          const root = JSON.parse(fs.readFileSync(files.root, 'utf8'));
          const backend = JSON.parse(fs.readFileSync(files.backend, 'utf8'));
          const frontend = JSON.parse(fs.readFileSync(files.frontend, 'utf8'));
          const app = JSON.parse(fs.readFileSync(files.app, 'utf8'));
          root.devDependencies['@oondemand/create-central-oon'] = '0.3.71';
          backend.dependencies['@oondemand/oon-core-back'] = '0.3.71';
          frontend.dependencies['@oondemand/oon-core-front'] = '0.3.71';
          app.compatibility.core.minVersion = '0.3.71';
          for (const [key, value] of Object.entries({ root, backend, frontend, app })) {
            fs.writeFileSync(files[key], `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE
      - name: Regenerar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar Central
        run: |
          node -e "for (const f of ['package.json','backend/package.json','frontend/package.json','central.app.json','frontend/central.ui.json','backend/central.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test --prefix backend
          npm run build --prefix frontend
          node -e "const fs=require('fs'); for (const f of ['package-lock.json','backend/package-lock.json','frontend/package-lock.json']) { const s=fs.readFileSync(f,'utf8'); if (!s.includes('0.3.71')) throw new Error(f+' não contém 0.3.71'); }"
      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upgrade-ooncore-0.3.71.yml
          git add package.json package-lock.json backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json central.app.json
          git commit -m "chore: atualizar OonCore para 0.3.71"
          git push origin HEAD:feat/sidecar-omie-automatico
