name: finalize-account-fixes-v2

on:
  push:
    branches:
      - fix/agrupamento-e-exclusao-contas
    paths:
      - .github/workflows/finalize-account-fixes-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agrupamento-e-exclusao-contas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar alterações
        run: node .github/scripts/finalize-account-fixes.js
      - name: Atualizar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Instalar backend e frontend
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar
        run: |
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test backend/test/*.test.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/central.ui.json','utf8')); JSON.parse(require('fs').readFileSync('central.app.json','utf8'))"
          npm run build --prefix frontend
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend frontend central.app.json
          git commit -m "chore: atualizar OonCore e persistir limpeza de parâmetros"
          git push origin HEAD:fix/agrupamento-e-exclusao-contas
