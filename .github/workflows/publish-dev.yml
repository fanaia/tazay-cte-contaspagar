name: publish-dev

on:
  push:
    branches: [main]
  # Fallback para merges feitos por integrações que não geram o evento de push.
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: publish-dev-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  request:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    permissions:
      contents: read
      id-token: write
    uses: oondemand/oon-publish/.github/workflows/request-dev.yml@main
