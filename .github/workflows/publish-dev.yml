name: publish-dev

on:
  push:
    branches: [main]
  # Fallback para merges realizados por integrações que não geram um novo workflow de push.
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

jobs:
  request:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: read
      id-token: write
    uses: oondemand/oon-publish/.github/workflows/request-dev.yml@main
