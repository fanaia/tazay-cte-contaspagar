name: apply-account-fixes

on:
  push:
    branches:
      - fix/agrupamento-e-exclusao-contas
    paths:
      - .github/workflows/apply-account-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agrupamento-e-exclusao-contas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Aplicar alterações funcionais
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado em {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "backend/src/services/contasPagar/payload.js",
              'return `${compra.instanceId || "default"}|${Number(compra.codigoFornecedorOmie)}|${compra.dataVencimento}`;',
              'return `${compra.instanceId || "default"}|${Number(compra.codigoFornecedorOmie)}`;',
          )

          reconciliation = Path("backend/src/services/contasPagar/reconciliation.js")
          text = reconciliation.read_text()
          marker = '''function unique(values) {\n  return [...new Set(values.filter((value) => value !== undefined && value !== null && value !== ""))];\n}\n'''
          helper = '''function unique(values) {\n  return [...new Set(values.filter((value) => value !== undefined && value !== null && value !== ""))];\n}\n\nfunction contaFoiSincronizada(conta = {}) {\n  return Number(conta.codigoLancamentoOmie || 0) > 0\n    || Number(conta.revisao || 0) > 0\n    || conta.statusEnvioOmie === "Enviado"\n    || ["Pendente sincronização", "Aberta", "Paga", "Pagamento cancelado"].includes(conta.status);\n}\n'''
          if marker not in text:
              raise SystemExit("Marcador unique não encontrado")
          text = text.replace(marker, helper, 1)

          start = text.index("async function obterOuCriarContaAtiva(compra) {")
          end = text.index("\nasync function recalcularConta(contaId) {", start)
          replacement = '''async function consolidarFornecedor(instanceId, codigoFornecedorOmie) {\n  const { Compra, ContaPagarAgrupada } = models();\n  const contas = await ContaPagarAgrupada.find({\n    instanceId,\n    codigoFornecedorOmie,\n    status: { $in: STATUS_ATIVOS },\n  }).sort({ codigoLancamentoOmie: -1, revisao: -1, dataVencimento: -1, updatedAt: -1 });\n  if (!contas.length) return null;\n\n  const sincronizada = contas.find((conta) => contaFoiSincronizada(conta));\n  const canonical = sincronizada || contas[0];\n  const duplicadasLocais = contas.filter((conta) => (\n    String(conta._id) !== String(canonical._id) && !contaFoiSincronizada(conta)\n  ));\n  const historicasSincronizadas = contas.filter((conta) => (\n    String(conta._id) !== String(canonical._id) && contaFoiSincronizada(conta)\n  ));\n\n  if (duplicadasLocais.length) {\n    const ids = duplicadasLocais.map((conta) => conta._id);\n    await Compra.updateMany(\n      { contaPagarId: { $in: ids } },\n      { $set: { contaPagarId: canonical._id, statusIntegracao: "Pendente", ultimoErro: "" } },\n    );\n    await ContaPagarAgrupada.deleteMany({ _id: { $in: ids } });\n  }\n  if (historicasSincronizadas.length) {\n    await ContaPagarAgrupada.updateMany(\n      { _id: { $in: historicasSincronizadas.map((conta) => conta._id) } },\n      { $unset: { chaveAtiva: 1 } },\n    );\n  }\n\n  const baseKey = chaveBase({ instanceId, codigoFornecedorOmie });\n  await ContaPagarAgrupada.updateMany(\n    { _id: { $ne: canonical._id }, chaveAtiva: baseKey },\n    { $unset: { chaveAtiva: 1 } },\n  );\n  await ContaPagarAgrupada.findByIdAndUpdate(canonical._id, {\n    $set: { chaveAtiva: baseKey },\n  });\n  if (duplicadasLocais.length) await recalcularConta(canonical._id);\n  return ContaPagarAgrupada.findById(canonical._id);\n}\n\nasync function obterOuCriarContaAtiva(compra) {\n  const { ContaPagarAgrupada } = models();\n  const baseKey = chaveBase(compra);\n  const consolidada = await consolidarFornecedor(compra.instanceId, compra.codigoFornecedorOmie);\n  if (consolidada) return consolidada;\n\n  const latest = await ContaPagarAgrupada.findOne({\n    instanceId: compra.instanceId,\n    codigoFornecedorOmie: compra.codigoFornecedorOmie,\n  }).sort({ geracao: -1 }).lean();\n  const generation = Number(latest?.geracao || 0) + 1;\n  try {\n    return await ContaPagarAgrupada.create({\n      chaveAgrupamento: `${baseKey}|g${generation}`,\n      chaveAtiva: baseKey,\n      instanceId: compra.instanceId,\n      codigoFornecedorOmie: compra.codigoFornecedorOmie,\n      nomeFornecedor: compra.nomeFornecedor,\n      dataVencimento: compra.dataVencimento,\n      geracao: generation,\n      codigoLancamentoIntegracao: codigoIntegracao(baseKey, generation),\n      status: "Pendente envio",\n      statusEnvioOmie: "Não enviado",\n      revisao: 0,\n      quantidadeCompras: 0,\n      valorTotal: 0,\n    });\n  } catch (error) {\n    if (error?.code !== 11000) throw error;\n    const conta = await ContaPagarAgrupada.findOne({ chaveAtiva: baseKey });\n    if (!conta) throw error;\n    return conta;\n  }\n}\n'''
          text = text[:start] + replacement + text[end:]

          old_set = '''  const set = {\n    quantidadeCompras: compras.length,\n    valorTotal,\n    status: "Pendente envio",\n    statusEnvioOmie: "Pendente",\n    ultimoErro: "",\n  };'''
          new_set = '''  const vencimentos = compras.map((compra) => String(compra.dataVencimento || "")).filter(Boolean).sort();\n  const set = {\n    quantidadeCompras: compras.length,\n    valorTotal,\n    dataVencimento: vencimentos.at(-1) || conta.dataVencimento,\n    status: "Pendente envio",\n    statusEnvioOmie: contaFoiSincronizada(conta) ? "Pendente" : "Não enviado",\n    ultimoErro: "",\n  };'''
          if old_set not in text:
              raise SystemExit("Set de recálculo não encontrado")
          text = text.replace(old_set, new_set, 1)

          export_marker = '''async function aprovarCompra(compraId, options = {}) {\n  return reconciliarCompra(compraId, { ...options, forceApproval: true });\n}\n'''
          management = '''async function resetarDocumentosConta(contaId) {\n  const { Compra } = models();\n  const now = new Date();\n  const result = await Compra.updateMany(\n    { contaPagarId: contaId },\n    {\n      $set: {\n        etapa: ETAPA_FATURADO,\n        statusAprovacao: "Pendente",\n        statusConclusaoOmie: "Não enviado",\n        statusIntegracao: "Sincronizado",\n        ultimaSincronizacaoEm: now,\n        ultimoErro: "",\n      },\n      $unset: {\n        contaPagarId: 1,\n        dataVencimento: 1,\n        aprovadaEm: 1,\n        aprovadaPor: 1,\n        categoriaFinanceiraId: 1,\n        codigoCategoriaFinanceiraOmie: 1,\n        nomeCategoriaFinanceira: 1,\n        contaCorrenteFinanceiraId: 1,\n        codigoContaCorrenteFinanceiraOmie: 1,\n        nomeContaCorrenteFinanceira: 1,\n        concluidaNoOmieEm: 1,\n      },\n    },\n  );\n  return Number(result.modifiedCount || 0);\n}\n\nasync function excluirContaLocal(contaId) {\n  const { ContaPagarAgrupada } = models();\n  const conta = await ContaPagarAgrupada.findById(contaId);\n  if (!conta) {\n    throw new GenericError("Conta a pagar não encontrada.", { statusCode: 404 });\n  }\n  if (conta.status !== "Excluída" && contaFoiSincronizada(conta)) {\n    throw new GenericError(\n      "Esta conta já foi sincronizada. Exclua primeiro o título no Omie e aguarde a confirmação na Central.",\n      { statusCode: 409, details: { field: "statusEnvioOmie", message: "Exclusão bloqueada até a remoção no Omie." } },\n    );\n  }\n  const documentosRestaurados = await resetarDocumentosConta(conta._id);\n  await ContaPagarAgrupada.findByIdAndDelete(conta._id);\n  return { contaId: String(conta._id), documentosRestaurados, deleted: true };\n}\n\nasync function consolidarContasAtivasPorFornecedor(options = {}) {\n  const { ContaPagarAgrupada } = models();\n  const limit = Math.max(1, Number(options.limit || 100));\n  const contas = await ContaPagarAgrupada.find({ status: { $in: STATUS_ATIVOS } })\n    .select("instanceId codigoFornecedorOmie")\n    .sort({ updatedAt: 1 })\n    .limit(limit * 10)\n    .lean();\n  const grupos = unique(contas.map((conta) => `${conta.instanceId}|${conta.codigoFornecedorOmie}`)).slice(0, limit);\n  const summary = { fornecedores: grupos.length, consolidados: 0, errors: [] };\n  for (const grupo of grupos) {\n    const separator = grupo.lastIndexOf("|");\n    const instanceId = grupo.slice(0, separator);\n    const codigoFornecedorOmie = Number(grupo.slice(separator + 1));\n    try {\n      const before = await ContaPagarAgrupada.countDocuments({\n        instanceId,\n        codigoFornecedorOmie,\n        status: { $in: STATUS_ATIVOS },\n      });\n      await consolidarFornecedor(instanceId, codigoFornecedorOmie);\n      const after = await ContaPagarAgrupada.countDocuments({\n        instanceId,\n        codigoFornecedorOmie,\n        status: { $in: STATUS_ATIVOS },\n      });\n      if (after < before) summary.consolidados += before - after;\n    } catch (error) {\n      summary.errors.push({ grupo, message: String(error?.message || error) });\n    }\n  }\n  return summary;\n}\n\nasync function aprovarCompra(compraId, options = {}) {\n  return reconciliarCompra(compraId, { ...options, forceApproval: true });\n}\n'''
          if export_marker not in text:
              raise SystemExit("Marcador de aprovarCompra não encontrado")
          text = text.replace(export_marker, management, 1)

          exports_old = '''module.exports = {\n  aprovarCompra,\n  aplicarAprovacao,\n  enviarContaParaOmie,\n  montarDadosAprovacao,\n  obterOuCriarContaAtiva,\n  recalcularConta,\n  reconciliarCompra,\n  reconciliarPendentes,\n};'''
          exports_new = '''module.exports = {\n  aprovarCompra,\n  aplicarAprovacao,\n  consolidarContasAtivasPorFornecedor,\n  consolidarFornecedor,\n  contaFoiSincronizada,\n  enviarContaParaOmie,\n  excluirContaLocal,\n  montarDadosAprovacao,\n  obterOuCriarContaAtiva,\n  recalcularConta,\n  reconciliarCompra,\n  reconciliarPendentes,\n  resetarDocumentosConta,\n};'''
          if exports_old not in text:
              raise SystemExit("Exports da reconciliação não encontrados")
          text = text.replace(exports_old, exports_new, 1)
          reconciliation.write_text(text)

          replace(
              "backend/src/hooks/integrationAutoProcessor.js",
              'const { enfileirarConclusaoCompras } = require("../services/contasPagar");',
              'const { consolidarContasAtivasPorFornecedor, enfileirarConclusaoCompras } = require("../services/contasPagar");',
          )
          replace(
              "backend/src/hooks/integrationAutoProcessor.js",
              '''  try {\n    const ticketsGerados = await enfileirarComprasPagasExistentes(options);''',
              '''  try {\n    const agrupamentos = await consolidarContasAtivasPorFornecedor({\n      limit: options.consolidationBatchSize || process.env.OON_ACCOUNT_CONSOLIDATION_BATCH_SIZE || 100,\n    });\n    const ticketsGerados = await enfileirarComprasPagasExistentes(options);''',
          )
          replace(
              "backend/src/hooks/integrationAutoProcessor.js",
              '''    return { ticketsGerados, resultados };''',
              '''    return { agrupamentos, ticketsGerados, resultados };''',
          )

          routes = Path("backend/src/routes/contasPagar.js")
          route_text = routes.read_text()
          route_text = route_text.replace(
              '''  enviarContaParaOmie,\n  obterConfiguracao,''',
              '''  enviarContaParaOmie,\n  excluirContaLocal,\n  obterConfiguracao,''',
              1,
          )
          insert_route = '''\n  router.private.delete("/contas/:id", {\n    roles: WRITE_ROLES,\n    audit: { action: "DELETE", entity: "ContaPagarAgrupada" },\n  }, async (req, res) => {\n    const result = await excluirContaLocal(req.params.id);\n    res.status(200).json({ success: true, result });\n  });\n'''
          anchor = '''  router.private.post("/contas/:id/consultar-pagamento", {'''
          if anchor not in route_text:
              raise SystemExit("Âncora de rota não encontrada")
          route_text = route_text.replace(anchor, insert_route + "\n" + anchor, 1)
          routes.write_text(route_text)

          webhooks = Path("backend/src/services/contasPagar/webhooks.js")
          webhook_text = webhooks.read_text()
          webhook_text = webhook_text.replace(
              'const { obterConfiguracao } = require("./configuration");\n',
              '',
              1,
          )
          webhook_text = webhook_text.replace(
              '''const { enviarContaParaOmie, recalcularConta, reconciliarCompra } = require("./reconciliation");''',
              '''const { recalcularConta, reconciliarCompra, resetarDocumentosConta } = require("./reconciliation");''',
              1,
          )
          branch_start = webhook_text.index('  if (eventType === "Financas.ContaPagar.Excluido") {')
          branch_end = webhook_text.index('\n  const statusPagamentoOmie =', branch_start)
          branch = '''  if (eventType === "Financas.ContaPagar.Excluido") {\n    await ContaPagarAgrupada.findByIdAndUpdate(conta._id, {\n      $set: {\n        ...commonSet,\n        status: "Excluída",\n        statusEnvioOmie: "Enviado",\n        statusPagamentoOmie: "Cancelado",\n      },\n      $unset: { chaveAtiva: 1 },\n    });\n    const documentosRestaurados = await resetarDocumentosConta(conta._id);\n    return {\n      contaId: String(conta._id),\n      status: "Excluída",\n      documentosRestaurados,\n      aguardandoExclusaoLocal: true,\n    };\n  }\n'''
          webhook_text = webhook_text[:branch_start] + branch + webhook_text[branch_end:]
          webhooks.write_text(webhook_text)

          model = Path("backend/src/models/ContaPagarAgrupada.js")
          model_text = model.read_text().replace(
              'quantidadeCompras: fields.number({ label: "Quantidade de compras", default: 0 })',
              'quantidadeCompras: fields.number({ label: "Quantidade de documentos", default: 0 })',
          )
          model.write_text(model_text)

          ui_path = Path("frontend/central.ui.json")
          ui = json.loads(ui_path.read_text())
          compra = next(item for item in ui["collections"] if item["model"] == "Compra")
          compra["list"]["rowActions"] = [
              action for action in compra["list"].get("rowActions", [])
              if action.get("type") != "openDetailModal"
          ]
          approve = next(action for action in compra["list"]["rowActions"] if action.get("id") == "aprovarCompra")
          approve["label"] = "Aprovar e gerar contas-pagar"
          approve["confirm"] = {
              "title": "Aprovar e gerar contas-pagar",
              "description": "O documento fiscal será aprovado e incluído na conta a pagar agrupada do fornecedor.",
          }

          conta = next(item for item in ui["collections"] if item["model"] == "ContaPagarAgrupada")
          conta["list"]["builtInActions"] = {"create": False, "edit": True, "delete": False}
          conta["list"]["columns"] = [
              "categoriaOmieId" if field == "nomeCategoriaOmie" else
              "contaCorrenteOmieId" if field == "nomeContaCorrenteOmie" else field
              for field in conta["list"]["columns"]
          ]
          conta["list"]["rowActions"] = [
              action for action in conta["list"].get("rowActions", [])
              if action.get("type") != "openDetailModal"
          ]
          conta["list"]["rowActions"].append({
              "id": "excluirContaLocal",
              "type": "apiAction",
              "label": "Excluir conta",
              "icon": "delete",
              "method": "DELETE",
              "endpoint": "/api/tazay/contas-pagar/contas/:id",
              "confirm": {
                  "title": "Excluir conta a pagar",
                  "description": "Contas já sincronizadas devem ser excluídas primeiro no Omie. Os documentos voltarão para aprovação.",
              },
              "refresh": ["self", "all"],
          })
          conta["relations"] = {
              "documentos": {
                  "model": "Compra",
                  "foreignKey": "contaPagarId",
                  "label": "NF-es e CT-es relacionadas",
              }
          }
          tabs = conta["detailModal"]["tabs"]
          if not any(tab.get("id") == "documentos" for tab in tabs):
              tabs.append({
                  "id": "documentos",
                  "label": "NF-es e CT-es relacionadas",
                  "type": "readonlyGrid",
                  "relation": "documentos",
                  "columns": [
                      "numeroDocumentoFiscal",
                      "tipoDocumentoFiscal",
                      "nomeFornecedor",
                      "valorFaturado",
                      "statusDocumentoOmie",
                      "statusAprovacao",
                      "dataVencimento",
                      "statusIntegracao",
                  ],
              })
          ui_path.write_text(json.dumps(ui, ensure_ascii=False, indent=2) + "\n")

          tests = Path("backend/test/agrupamentoExclusao.test.js")
          tests.write_text('''"use strict";\n\nconst fs = require("node:fs");\nconst path = require("node:path");\nconst test = require("node:test");\nconst assert = require("node:assert/strict");\nconst { chaveBase, contaFoiSincronizada } = require("../src/services/contasPagar");\n\ntest("agrupa documentos por instância e fornecedor, independentemente do vencimento", () => {\n  const julho = chaveBase({ instanceId: "default", codigoFornecedorOmie: 123, dataVencimento: "2026-07-15" });\n  const agosto = chaveBase({ instanceId: "default", codigoFornecedorOmie: 123, dataVencimento: "2026-08-05" });\n  const outro = chaveBase({ instanceId: "default", codigoFornecedorOmie: 456, dataVencimento: "2026-08-05" });\n  assert.equal(julho, agosto);\n  assert.notEqual(julho, outro);\n});\n\ntest("identifica conta sincronizada por código, revisão ou status operacional", () => {\n  assert.equal(contaFoiSincronizada({ revisao: 0, status: "Pendente envio" }), false);\n  assert.equal(contaFoiSincronizada({ revisao: 1, status: "Pendente envio" }), true);\n  assert.equal(contaFoiSincronizada({ codigoLancamentoOmie: 123 }), true);\n  assert.equal(contaFoiSincronizada({ status: "Aberta" }), true);\n});\n\ntest("interface usa ação de negócio, aba relacionada e exclusão protegida", () => {\n  const ui = JSON.parse(fs.readFileSync(path.join(__dirname, "../../frontend/central.ui.json"), "utf8"));\n  const compra = ui.collections.find((item) => item.model === "Compra");\n  const conta = ui.collections.find((item) => item.model === "ContaPagarAgrupada");\n  assert.equal(compra.list.rowActions.some((action) => action.label === "Dados e parâmetros"), false);\n  assert.equal(compra.list.rowActions.some((action) => action.label === "Aprovar e gerar contas-pagar"), true);\n  assert.deepEqual(conta.list.builtInActions, { create: false, edit: true, delete: false });\n  assert.equal(conta.detailModal.tabs.some((tab) => tab.id === "documentos" && tab.type === "readonlyGrid"), true);\n  assert.equal(conta.list.rowActions.some((action) => action.method === "DELETE"), true);\n});\n\ntest("webhook de exclusão não recria automaticamente outra conta", () => {\n  const source = fs.readFileSync(path.join(__dirname, "../src/services/contasPagar/webhooks.js"), "utf8");\n  const start = source.indexOf('eventType === "Financas.ContaPagar.Excluido"');\n  const end = source.indexOf("const statusPagamentoOmie", start);\n  const branch = source.slice(start, end);\n  assert.match(branch, /resetarDocumentosConta/);\n  assert.doesNotMatch(branch, /reconciliarCompra/);\n  assert.doesNotMatch(branch, /enviarContaParaOmie/);\n});\n''')

          existing = Path("backend/test/contasPagar.test.js")
          existing_text = existing.read_text()
          existing_text = existing_text.replace(
              'test("agrupamento usa uma conta ativa por fornecedor e vencimento", () => {',
              'test("agrupamento usa uma conta ativa por fornecedor", () => {',
          )
          existing_text = existing_text.replace(
              '  assert.notEqual(primeira, outraSemana);',
              '  assert.equal(primeira, outraSemana);',
          )
          existing.write_text(existing_text)
          PY
      - name: Instalar backend
        run: npm ci --prefix backend
      - name: Validar e testar
        run: |
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test backend/test/*.test.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/central.ui.json','utf8'))"
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src backend/test frontend/central.ui.json
          git commit -m "fix: agrupar contas por fornecedor e proteger exclusão" || exit 0
          git push origin HEAD:fix/agrupamento-e-exclusao-contas
