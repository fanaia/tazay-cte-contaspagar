name: update-front-lock-temp

on:
  push:
    branches: [feat/issue-35-operacao-pagamentos]
    paths:
      - frontend/package.json

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Atualizar package-lock do frontend
        run: npm install --package-lock-only --ignore-scripts --prefix frontend
      - name: Commitar lock atualizado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualizar lock do oonCore front"
          git push origin HEAD:feat/issue-35-operacao-pagamentos
