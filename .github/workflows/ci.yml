name: ci

on:
  pull_request:
  push:
    branches:
      - feat/issue-2-contas-pagar-agrupadas

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar backend
        run: npm ci --prefix backend
      - name: Validar sintaxe JavaScript
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validar manifestos JSON
        run: node -e "for (const f of ['central.app.json','frontend/central.ui.json','backend/central.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Executar testes
        run: npm test --prefix backend
