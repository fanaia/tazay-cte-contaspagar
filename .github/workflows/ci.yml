name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Fallback para merges feitos por integrações que não geram o evento de push.
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar backend
        run: npm ci --prefix backend
      - name: Instalar frontend
        run: npm ci --prefix frontend
      - name: Validar sintaxe JavaScript
        run: find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validar manifestos JSON
        run: node -e "for (const f of ['central.app.json','frontend/central.ui.json','backend/central.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Executar testes
        run: npm test --prefix backend
      - name: Compilar frontend
        run: npm run build --prefix frontend
