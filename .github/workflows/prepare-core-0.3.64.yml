name: prepare-core-0.3.64

on:
  push:
    branches:
      - feat/configuracao-etapa-transparencia-omie
    paths:
      - package.json
      - backend/package.json
      - frontend/package.json
      - .github/workflows/prepare-core-0.3.64.yml

permissions:
  contents: write

concurrency:
  group: prepare-core-0.3.64
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/configuracao-etapa-transparencia-omie
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Regenerate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix backend --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          find backend/src backend/test -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test --prefix backend

      - name: Validate frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend

      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles já estão atualizados."
            exit 0
          fi
          git commit -m "chore: atualizar lockfiles para OonCore 0.3.64"
          git push origin HEAD:feat/configuracao-etapa-transparencia-omie
