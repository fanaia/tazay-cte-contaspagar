name: update-core-lockfiles

on:
  push:
    branches:
      - agent/update-core-0.3.74

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/update-core-0.3.74
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Atualizar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --prefix backend @oondemand/oon-core-back@0.3.74
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --prefix frontend @oondemand/oon-core-front@0.3.74

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles já estão atualizados."
            exit 0
          fi
          git commit -m "Atualizar lockfiles para OonCore 0.3.74"
          git push origin HEAD:agent/update-core-0.3.74
