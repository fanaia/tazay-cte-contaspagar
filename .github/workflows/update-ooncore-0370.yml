name: update-ooncore-0370

on:
  push:
    branches:
      - feat/sidecar-omie-automatico
    paths:
      - .github/workflows/update-ooncore-0370.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sidecar-omie-automatico
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Regenerar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --prefix backend --package-lock-only --ignore-scripts
          npm install --prefix frontend --package-lock-only --ignore-scripts
      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar Central
        run: |
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "for (const f of ['central.app.json','frontend/central.ui.json','backend/central.manifest.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          npm test --prefix backend
          npm run build --prefix frontend
      - name: Commitar lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json frontend/package-lock.json
          git commit -m "chore: atualizar lockfiles para OonCore 0.3.70"
          git push origin HEAD:feat/sidecar-omie-automatico
