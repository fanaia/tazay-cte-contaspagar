name: refresh-core-lock-temp

on:
  push:
    branches: [fix/omie-webhook-core-0.3.73]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Atualizar package-lock do backend
        run: npm install --package-lock-only --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Persistir lockfile e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git rm .github/workflows/refresh-core-lock-temp.yml
          git commit -m "chore: atualizar lockfile do OonCore 0.3.73"
          git push
