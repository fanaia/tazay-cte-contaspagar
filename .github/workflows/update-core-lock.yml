name: update-core-lock

on:
  push:
    branches:
      - fix/listagem-nfe-cte-pendentes
    paths:
      - backend/package.json

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/listagem-nfe-cte-pendentes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Atualizar lockfile do backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
      - name: Commitar lockfile
        run: |
          if git diff --quiet backend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: atualizar lockfile para OonCore 0.3.68"
          git push origin HEAD:fix/listagem-nfe-cte-pendentes
