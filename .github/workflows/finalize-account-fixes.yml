name: finalize-account-fixes

on:
  push:
    branches:
      - fix/agrupamento-e-exclusao-contas
    paths:
      - .github/workflows/finalize-account-fixes.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agrupamento-e-exclusao-contas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Corrigir limpeza de parâmetros derivados
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("backend/src/services/contasPagar/reconciliation.js")
          text = path.read_text()
          old = '''  const set = {};
  if (categoryId) {
    const categoria = await resolverCategoria(categoryId);
    set.categoriaOmieId = categoria.id;
    set.codigoCategoriaOmie = categoria.codigo;
    set.nomeCategoriaOmie = categoria.nome;
  }
  if (currentAccountId) {
    const contaCorrente = await resolverContaCorrente(currentAccountId);
    set.contaCorrenteOmieId = contaCorrente.id;
    set.codigoContaCorrenteOmie = contaCorrente.codigo;
    set.nomeContaCorrenteOmie = contaCorrente.nome;
  }
  if (Object.keys(set).length) {
    conta = await ContaPagarAgrupada.findByIdAndUpdate(
      conta._id,
      { $set: set },
      { new: true, runValidators: true },
    );
  }
'''
          new = '''  const set = {};
  const unset = {};
  if (categoryId) {
    const categoria = await resolverCategoria(categoryId);
    set.categoriaOmieId = categoria.id;
    set.codigoCategoriaOmie = categoria.codigo;
    set.nomeCategoriaOmie = categoria.nome;
  } else {
    unset.categoriaOmieId = 1;
    unset.codigoCategoriaOmie = 1;
    unset.nomeCategoriaOmie = 1;
  }
  if (currentAccountId) {
    const contaCorrente = await resolverContaCorrente(currentAccountId);
    set.contaCorrenteOmieId = contaCorrente.id;
    set.codigoContaCorrenteOmie = contaCorrente.codigo;
    set.nomeContaCorrenteOmie = contaCorrente.nome;
  } else {
    unset.contaCorrenteOmieId = 1;
    unset.codigoContaCorrenteOmie = 1;
    unset.nomeContaCorrenteOmie = 1;
  }
  if (Object.keys(set).length || Object.keys(unset).length) {
    const update = {};
    if (Object.keys(set).length) update.$set = set;
    if (Object.keys(unset).length) update.$unset = unset;
    conta = await ContaPagarAgrupada.findByIdAndUpdate(
      conta._id,
      update,
      { new: true, runValidators: true },
    );
  }
'''
          if old not in text:
              raise SystemExit("Bloco de parâmetros financeiros não encontrado")
          path.write_text(text.replace(old, new, 1))

          versions = {
            "package.json": ("devDependencies", "@oondemand/create-central-oon"),
            "backend/package.json": ("dependencies", "@oondemand/oon-core-back"),
            "frontend/package.json": ("dependencies", "@oondemand/oon-core-front"),
          }
          for filename, (section, package) in versions.items():
              p = Path(filename)
              data = json.loads(p.read_text())
              data[section][package] = "0.3.69"
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          manifest = Path("central.app.json")
          data = json.loads(manifest.read_text())
          data["compatibility"]["core"]["minVersion"] = "0.3.69"
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          test = Path("backend/test/parametrosFinanceiros.test.js")
          test.write_text('''"use strict";\n\nconst fs = require("node:fs");\nconst path = require("node:path");\nconst test = require("node:test");\nconst assert = require("node:assert/strict");\n\ntest("envio remove códigos derivados quando referências foram limpas", () => {\n  const source = fs.readFileSync(path.join(__dirname, "../src/services/contasPagar/reconciliation.js"), "utf8");\n  const start = source.indexOf("const categoryId =");\n  const end = source.indexOf("const compras = await Compra.find", start);\n  const block = source.slice(start, end);\n  assert.match(block, /unset\.categoriaOmieId = 1/);\n  assert.match(block, /unset\.codigoCategoriaOmie = 1/);\n  assert.match(block, /unset\.contaCorrenteOmieId = 1/);\n  assert.match(block, /unset\.codigoContaCorrenteOmie = 1/);\n  assert.match(block, /update\.\$unset = unset/);\n});\n''')
          PY
      - name: Atualizar lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Instalar e validar
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test backend/test/*.test.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/central.ui.json','utf8')); JSON.parse(require('fs').readFileSync('central.app.json','utf8'))"
          npm run build --prefix frontend
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend frontend central.app.json
          git commit -m "chore: atualizar OonCore e persistir limpeza de parâmetros" || exit 0
          git push origin HEAD:fix/agrupamento-e-exclusao-contas
