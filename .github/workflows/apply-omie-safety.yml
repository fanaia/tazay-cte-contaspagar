name: apply-omie-safety

on:
  push:
    branches:
      - fix/omie-single-attempt-and-ticket-menu
    paths:
      - .github/workflows/apply-omie-safety.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/omie-single-attempt-and-ticket-menu
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Aplicar correções
        run: node .github/scripts/apply-omie-safety.js
      - name: Instalar dependências
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Validar backend e frontend
        run: |
          find backend/src backend/test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test backend/test/*.test.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/central.ui.json','utf8'))"
          npm run build --prefix frontend
      - name: Commitar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src backend/test frontend/central.ui.json
          git commit -m "fix: impedir repetição e consumo indevido no Omie"
          git push origin HEAD:fix/omie-single-attempt-and-ticket-menu
